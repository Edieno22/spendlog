<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendLog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SpendLog</h1>
    <p>A personal expense tracker with reports</p>
  </header>

  <main>
    <section>
      <h2>Add expense</h2>
      <form id="expense-form">
        <label>Date <input type="date" name="date" required></label>
        <label>Description <input type="text" name="description" maxlength="100" required></label>
        <label>Category <input type="text" name="category" maxlength="40" list="categories" required></label>
        <label>Amount <input type="number" name="amount" min="0.01" step="0.01" required></label>
        <button type="submit">Save expense</button>
      </form>
      <datalist id="categories"></datalist>
      <p id="form-message" class="message" role="status"></p>
    </section>

    <section>
      <h2>Expenses</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th></tr></thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Reports</h2>
      <form id="filter-form">
        <label>Start date <input type="date" name="start"></label>
        <label>End date <input type="date" name="end"></label>
        <button type="submit">Apply</button>
        <button type="button" id="clear" class="secondary">Clear</button>
      </form>
      <p id="filter-message" class="message" role="status"></p>

      <div class="reports">
        <article>
          <h3>By category</h3>
          <table>
            <thead><tr><th>Category</th><th class="num">Total</th></tr></thead>
            <tbody id="category-rows"></tbody>
          </table>
        </article>
        <article>
          <h3>Daily</h3>
          <table>
            <thead><tr><th>Date</th><th class="num">Total</th></tr></thead>
            <tbody id="daily-rows"></tbody>
          </table>
        </article>
        <article>
          <h3>Monthly</h3>
          <table>
            <thead><tr><th>Month</th><th class="num">Total</th></tr></thead>
            <tbody id="monthly-rows"></tbody>
          </table>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
